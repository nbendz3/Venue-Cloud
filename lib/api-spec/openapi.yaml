openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: VenueCloud API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Event management
  - name: functions
    description: Function management
  - name: leads
    description: Event leads
  - name: accounts
    description: Account management
  - name: contacts
    description: Contact management
  - name: tasks
    description: Task management
  - name: notes
    description: Notes
  - name: appointments
    description: Appointments
  - name: guest-rooms
    description: Guest room blocks
  - name: locations
    description: Locations
  - name: reports
    description: Reports
  - name: calendar
    description: Calendar
  - name: dashboard
    description: Dashboard summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
