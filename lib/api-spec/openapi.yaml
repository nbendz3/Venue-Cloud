              required:
                - relatedType
                - relatedId
                - amount
      responses:
        "201":
          description: Deposit scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositScheduled"

  # Adjustments
  /adjustments:
    post:
      operationId: createAdjustment
      tags: [financials]
      summary: Create an adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                functionId:
                  type: integer
                date:
                  type: string
                amount:
                  type: number
                revenueCenterId:
                  type: integer
                appliedRates:
                  type: string
                description:
                  type: string
                salesperson:
                  type: string
              required:
                - functionId
                - amount
      responses:
        "201":
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"

  /adjustments/{id}:
    delete:
      operationId: deleteAdjustment
      tags: [financials]
      summary: Delete an adjustment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Event & Function Financials
  /events/{id}/financials:
    get:
      operationId: getEventFinancials
      tags: [financials]
      summary: Get event financial details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event financials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFinancials"

  /functions/{id}/financials:
    get:
      operationId: getFunctionFinancials
      tags: [financials]
      summary: Get function financial details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Function financials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunctionFinancials"

  /functions/{id}/post:
    post:
      operationId: postFunction
      tags: [financials]
      summary: Post a function (lock financial figures)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Function posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunctionLifecycleHistory"

