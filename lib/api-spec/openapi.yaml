components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      properties:
        totalEvents:
          type: integer
        eventsThisMonth:
          type: integer
        openLeads:
          type: integer
        openTasks:
          type: integer
        totalAccounts:
          type: integer
        totalContacts:
          type: integer
        eventsByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
            required: [status, count]
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      required:
        - totalEvents
        - eventsThisMonth
        - openLeads
        - openTasks
        - totalAccounts
        - totalContacts
        - eventsByStatus
        - upcomingEvents

    Event:
      type: object
      properties:
        id:
          type: integer
        eventName:
          type: string
        eventNumber:
          type: ["string", "null"]
        eventType:
          type: ["string", "null"]
        eventCategory:
          type: ["string", "null"]
        marketType:
          type: ["string", "null"]
        referralType:
          type: ["string", "null"]
        estimatedAttendance:
          type: ["integer", "null"]
        owner:
          type: ["string", "null"]
        salesperson:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        eventStatus:
          type: string
          enum: [New, Tentative, Definite, Closed, Cancelled]
        site:
          type: ["string", "null"]
        eventNote:
          type: ["string", "null"]
        paymentArrangements:
          type: ["string", "null"]
        billingNotes:
          type: ["string", "null"]
        taxExempt:
          type: ["boolean", "null"]
        primaryContactId:
          type: ["integer", "null"]
        billingContactId:
          type: ["integer", "null"]
        masterEventId:
          type: ["integer", "null"]
        groupMasterAccount:
          type: ["string", "null"]
        lifecycleModel:
          type: ["string", "null"]
        pmsGroupNumber:
